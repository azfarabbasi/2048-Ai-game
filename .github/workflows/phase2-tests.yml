name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python demo.py
      - run: python experiments.py --seeds 1-2 --depths 1 --max-moves 20 --output-dir smoke-results
      - run: python charts.py --input smoke-results --output smoke-results/charts
